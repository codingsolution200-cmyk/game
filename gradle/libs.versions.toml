[versions]
agp              = "8.10.0"
kotlin           = "2.2.0"
hilt             = "2.56"
coroutines       = "1.9.0"
lifecycle        = "2.8.6"
activity         = "1.9.2"
appcompat        = "1.7.0"
material         = "1.12.0"
lottie           = "6.3.0"
admob            = "23.4.0"
firebase-bom     = "33.5.1"
gson             = "2.11.0"
splashscreen     = "1.0.1"
constraintlayout = "2.1.4"
core-ktx         = "1.13.1"
junit            = "4.13.2"
androidx-junit   = "1.2.1"
espresso         = "3.6.1"
mediation-test-suite       = "3.0.0"
google-gms-google-services = "4.4.4"

[libraries]
androidx-core-ktx         = { group = "androidx.core",               name = "core-ktx",                   version.ref = "core-ktx"         }
androidx-appcompat        = { group = "androidx.appcompat",          name = "appcompat",                  version.ref = "appcompat"        }
androidx-activity-ktx     = { group = "androidx.activity",           name = "activity-ktx",               version.ref = "activity"         }
androidx-constraintlayout = { group = "androidx.constraintlayout",   name = "constraintlayout",           version.ref = "constraintlayout" }
androidx-lifecycle-vm     = { group = "androidx.lifecycle",          name = "lifecycle-viewmodel-ktx",    version.ref = "lifecycle"        }
androidx-lifecycle-rt     = { group = "androidx.lifecycle",          name = "lifecycle-runtime-ktx",      version.ref = "lifecycle"        }
material                  = { group = "com.google.android.material",  name = "material",                   version.ref = "material"         }
splashscreen              = { group = "androidx.core",               name = "core-splashscreen",          version.ref = "splashscreen"     }
kotlinx-coroutines        = { group = "org.jetbrains.kotlinx",       name = "kotlinx-coroutines-android", version.ref = "coroutines"       }
hilt-android              = { group = "com.google.dagger",           name = "hilt-android",               version.ref = "hilt"             }
hilt-compiler             = { group = "com.google.dagger",           name = "hilt-android-compiler",      version.ref = "hilt"             }
lottie                    = { group = "com.airbnb.android",          name = "lottie",                     version.ref = "lottie"           }
admob                     = { group = "com.google.android.gms",      name = "play-services-ads",          version.ref = "admob"            }
mediation-test-suite      = { group = "com.google.android.ads",      name = "mediation-test-suite",       version.ref = "mediation-test-suite" }

# Firebase BOM — version BOM thi aave
firebase-bom              = { group = "com.google.firebase",         name = "firebase-bom",               version.ref = "firebase-bom"     }
firebase-analytics        = { group = "com.google.firebase",         name = "firebase-analytics-ktx"                                       }
firebase-crashlytics      = { group = "com.google.firebase",         name = "firebase-crashlytics-ktx"                                     }
firebase-database         = { group = "com.google.firebase",         name = "firebase-database-ktx"                                        }
firebase-config           = { group = "com.google.firebase",         name = "firebase-config-ktx"                                          }

gson                      = { group = "com.google.code.gson",        name = "gson",                       version.ref = "gson"             }
junit                     = { group = "junit",                       name = "junit",                      version.ref = "junit"            }
androidx-junit            = { group = "androidx.test.ext",           name = "junit",                      version.ref = "androidx-junit"   }
androidx-espresso-core    = { group = "androidx.test.espresso",      name = "espresso-core",              version.ref = "espresso"         }

[plugins]
android-application        = { id = "com.android.application",        version.ref = "agp"    }
kotlin-android             = { id = "org.jetbrains.kotlin.android",   version.ref = "kotlin" }
hilt                       = { id = "com.google.dagger.hilt.android", version.ref = "hilt"   }
google-gms-google-services = { id = "com.google.gms.google-services", version.ref = "google-gms-google-services" }